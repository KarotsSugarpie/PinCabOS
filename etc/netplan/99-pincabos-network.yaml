# PINCABOS_NETWORK_V2 — configuration réseau pilotée par la WebApp PinCabOS.
# Fichier unique et prioritaire : ne pas rétablir les fichiers .pincabos-disabled.
network:
  version: 2
  renderer: NetworkManager
  ethernets:
    enp6s0:
      dhcp4: false
      dhcp6: false
      addresses:
        - 192.168.254.237/24
      routes:
        - to: default
          via: 192.168.254.1
      nameservers:
        addresses: [192.168.254.1]
      optional: true
