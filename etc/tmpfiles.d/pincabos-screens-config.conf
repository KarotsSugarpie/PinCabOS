# PINCABOS_SCREENS_CONFIG_WRITABLE_V1
#
# La page Ecrans tourne sous l'identite pinball (pincabos-webapp.service) et
# doit pouvoir enregistrer screens.json. Le fichier etant cree par des
# composants root, il se retrouve en 0644 root:root : la page echoue alors
# silencieusement, et l'utilisateur voit ses choix disparaitre.
#
# 'z' ajuste mode et proprietaire d'un fichier existant sans jamais le creer :
# une installation sans ce fichier reste inchangee.
z /opt/pincabos/config/screens               0775 root pinball -
z /opt/pincabos/config/screens/screens.json  0664 root pinball -
