# PINCABOS_SCREENS_CONFIG_WRITABLE_V2
#
# La WebApp tourne sous l'utilisateur pinball et doit pouvoir enregistrer
# screens.json.
#
# /opt/pincabos/config appartient deja a pinball. Les chemins enfants doivent
# garder le meme proprietaire pour ne pas creer une transition de confiance
# refusee par systemd-tmpfiles.
#
# Root conserve naturellement un acces complet.
#
# 'z' ne cree rien : il ajuste uniquement un chemin existant.
z /opt/pincabos/config/screens               0775 pinball pinball -
z /opt/pincabos/config/screens/screens.json  0664 pinball pinball -
