# PinCabOS - split ScoreView des PuP-Packs
# Le script pincabos-pup-scoreview-split.py tourne en pinball (la chaine de
# lancement est lancee par VPinFE) et ne peut pas creer lui-meme un
# repertoire sous /run : sans cette entree il echouait en PermissionError a
# chaque table PuP et le split restait silencieusement inactif.
d /run/pincabos-pup-scoreview-split 0755 pinball pinball -
