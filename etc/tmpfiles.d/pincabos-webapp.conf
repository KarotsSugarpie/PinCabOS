# pincabos-webapp runs as `pinball` and generates its own session secret
# (webapp-secret.key) on first start. The directory ships as root:root 0755,
# so without this the service dies at boot on a fresh image. Shipping a
# pre-made secret is not an option: every ISO would share the same one.
d /opt/pincabos/config 0775 root pinball -

# PINCABOS_WEBAPP_VERSION_JSON_WRITE_V1
# version.json existe deja dans l'image root:root 0644.
# Le WebApp tourne comme pinball et doit pouvoir enregistrer /admin/version.
z /opt/pincabos/config/version.json 0664 root pinball - -
