# PinCabOS — LightDM occupe desormais le terminal 1 (celui de Plymouth).
# Sans cette declaration, la console de secours du VT 1 et le serveur X
# se disputeraient le meme terminal. GDM procede de la meme facon sur
# Ubuntu pour le terminal qu'il occupe.
[Unit]
Conflicts=getty@tty1.service
After=getty@tty1.service
