[Service]
# Let the Flask wizard answer before WebKit loads the URL, otherwise the kiosk
# shows a connection error on slower machines.
# PINCABOS_FAIL_LOUDLY_V1
# La boucle se terminait sur « sleep 1 », donc sur un code 0 : l'attente
# reussissait meme quand le wizard n'avait jamais repondu, et le kiosk
# affichait l'erreur de connexion qu'elle devait eviter.
ExecStartPre=/bin/bash -c 'for i in $(seq 1 30); do (exec 3<>/dev/tcp/127.0.0.1/8046) 2>/dev/null && { exec 3>&-; exit 0; }; sleep 1; done; echo "NOGO: le wizard n a pas repondu sur 127.0.0.1:8046 en 30 s" >&2; exit 1'
