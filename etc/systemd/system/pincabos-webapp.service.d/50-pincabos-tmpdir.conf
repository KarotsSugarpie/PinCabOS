# PINCABOS_WEBAPP_TMPDIR_V1
#
# Werkzeug deverse les envois volumineux dans le repertoire temporaire avant
# de les remettre a l'application. Quand /tmp est un tmpfs — donc en memoire
# vive — l'import d'une table de plusieurs Go echoue faute de place, ou
# epuise la memoire du cabinet en pleine partie.
#
# On lui donne un repertoire sur disque. RuntimeDirectory ne conviendrait pas
# ici : il vit lui aussi en memoire.
[Service]
Environment=TMPDIR=/var/tmp/pincabos-uploads
Environment=TEMP=/var/tmp/pincabos-uploads
Environment=TMP=/var/tmp/pincabos-uploads
