[Service]
Environment=TMPDIR=/var/tmp/pincabos-vpinfe
Environment=TMP=/var/tmp/pincabos-vpinfe
Environment=TEMP=/var/tmp/pincabos-vpinfe

# Avant demarrage : elimine tout Chrome VPinFE reste d'une session precedente.
ExecStartPre=/usr/local/libexec/pincabos/vpinfe-chromium-profile-cleanup.sh prestart

# Apres arret / crash / restart : ferme les scopes Chrome hors cgroup VPinFE.
ExecStopPost=/usr/local/libexec/pincabos/vpinfe-chromium-profile-cleanup.sh poststop
