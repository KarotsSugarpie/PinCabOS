# PinCabOS — recale le <ComPortName> du TeensyStripController dans cabinet.xml
# avant chaque démarrage de vpinfe : le /dev/ttyACM* du Teensy peut changer au
# reboot selon l'ordre d'énumération USB (surtout avec une Dude's Cab à côté).
# Sans Teensy ou sans cabinet.xml, le script sort en 0 sans rien toucher.
[Service]
ExecStartPre=-/opt/pincabos/tools/fix-teensy-port.sh
