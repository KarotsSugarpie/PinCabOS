# PINCABOS_BACKBOARD_MENU_V1
# Logos de table (contenu communautaire aerao) sur le backboard HD au menu :
# - backboard absent de cabinet.xml -> sortie immediate, aucun effet ;
# - backboard present + contenu installe -> mapping des nouvelles tables
#   avant que vpinfe lise les .info (rapide, hors ligne) ;
# - backboard present + rien d'installe -> installation automatique detachee
#   (telechargements aerao, injection, mapping, restart), une fois par boot.
# Le "-" garantit de ne jamais bloquer le demarrage du frontend.
[Service]
ExecStartPre=-/opt/pincabos/tools/backboard-menu/pincabos-backboard-menu.sh auto
