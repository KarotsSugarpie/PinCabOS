# PINCABOS_LAUNCHERS_SYNC_V1
# /opt/pincabos/launchers doit etre un lien vers la chaine de lancement
# livree (/opt/pincabos/tools/launchers) avant que quoi que ce soit ne
# lance une table. Le "-" garantit de ne jamais bloquer le frontend.
[Service]
ExecStartPre=-/opt/pincabos/tools/pincabos-launchers-sync
