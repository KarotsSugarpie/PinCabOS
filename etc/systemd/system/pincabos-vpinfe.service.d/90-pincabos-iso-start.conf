[Unit]
After=pincabos-firstboot-hardware-autoconfig.service display-manager.service network-online.target pincabos-screen-topology-boot.service
Requires=pincabos-screen-topology-boot.service
Wants=network-online.target
StartLimitIntervalSec=120
StartLimitBurst=3

[Service]
ExecStartPre=/usr/local/libexec/pincabos/pincabos-vpinfe-display-sanitize
Restart=always
RestartSec=6
TimeoutStartSec=90
TimeoutStopSec=25
