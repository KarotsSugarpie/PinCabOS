# PinCabOS — passage de relais sans console visible.
#
# LightDM ne reprend le terminal de Plymouth que si son numero est au
# moins egal a minimum-vt, laisse a 7 par defaut. Plymouth occupant le
# VT 1, la condition n'etait jamais vraie : LightDM le faisait quitter
# sans conserver l'image, la console redevenait visible, et on lisait
# quelques lignes d'etat avant l'arrivee du frontend.
[LightDM]
minimum-vt=1
