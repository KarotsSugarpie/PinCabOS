name: PinCabOS Bootstrap Alpha 3.04

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pincabos-bootstrap-alpha304.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected Alpha 3.04 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          if gh release view alpha3.04-beta.20260901.1 \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1
          then
            echo "Alpha 3.04 existe deja : aucun nouveau dispatch."
            exit 0
          fi

          gh workflow run pincabos-release-v4.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f pr_number=104 \
            -f channel=beta
