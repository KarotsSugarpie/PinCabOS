name: PinCabOS ISO RW hardening one shot

on:
  push:
    paths:
      - ".github/workflows/pincabos-iso-rw-hardening-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply ISO hardening
        run: python3 DEV/pincabos_iso_rw_hardening_once.py

      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n opt/pincabos/script/iso.sh
          git diff --check
          grep -q 'PINCABOS_TARGET_RW_PREFLIGHT_V1' opt/pincabos/script/iso.sh
          grep -q 'PINCABOS_TARGET_RW_GUARD_V1' opt/pincabos/script/iso.sh
          grep -q 'recover_fresh_target_filesystem_once' opt/pincabos/script/iso.sh

      - name: Commit final correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "PinCabOS ISO Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pincabos-iso-rw-hardening-once.yml
          git rm DEV/pincabos_iso_rw_hardening_once.py
          git add opt/pincabos/script/iso.sh
          git commit -m "fix(iso): harden target RW and recover fresh ext4 once"
          git pull --rebase origin main
          git push origin HEAD:main
