name: PinCabOS Tester Report Ingest

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: pincabos-tester-report-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'KarotsSugarpie' &&
      github.event.comment.body == 'PINCABOS_TESTER_REPORT_COMPLETE_V3' &&
      startsWith(github.event.issue.title, '[PINCABOS-TESTER-REPORT-V3]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh main before ingest
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Reconstruct tester report
        id: ingest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python3 DEV/config-testeur/pincabos-tester-report-ingest-v3.py \
            '${{ github.event.issue.number }}'

      - name: Validate destination scope
        run: |
          set -Eeuo pipefail
          REPORT='${{ steps.ingest.outputs.report_path }}'
          case "$REPORT" in
            DEV/config-testeur/*-system-audit.txt) ;;
            *) echo "NOGO destination hors scope: $REPORT" >&2; exit 1 ;;
          esac
          test -f "$REPORT"
          git diff --check -- "$REPORT"

      - name: Commit report only
        env:
          REPORT_PATH: ${{ steps.ingest.outputs.report_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -Eeuo pipefail
          git config user.name 'PinCabOS Tester Report Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "$REPORT_PATH"
          git diff --cached --quiet && { echo 'NOGO aucun rapport a committer' >&2; exit 1; }
          CHANGED="$(git diff --cached --name-only)"
          test "$CHANGED" = "$REPORT_PATH" || { echo 'NOGO plusieurs fichiers stages' >&2; exit 1; }
          git commit -m "tester report: issue #${ISSUE_NUMBER}"
          git push origin HEAD:main

      - name: Confirm and close transport issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPORT_PATH: ${{ steps.ingest.outputs.report_path }}
          REPORT_SHA: ${{ steps.ingest.outputs.report_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          issue = os.environ['ISSUE_NUMBER']
          token = os.environ['GH_TOKEN']
          report_path = os.environ['REPORT_PATH']
          report_sha = os.environ['REPORT_SHA']
          base = f'https://api.github.com/repos/{repo}/issues/{issue}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json',
              'User-Agent': 'PinCabOS-Tester-Report-Ingest/3',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def post(url, payload, method='POST'):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode('utf-8'),
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  response.read()

          post(
              base + '/comments',
              {'body': f'GO [OK] Rapport ingere: `{report_path}`\nSHA256: `{report_sha}`'},
          )
          post(base, {'state': 'closed', 'state_reason': 'completed'}, method='PATCH')
          PY
