name: Explorer Pagination Canonical Source Edit

on:
  push:
    branches:
      - feat/explorer-table-pagination

permissions:
  contents: write

jobs:
  edit-canonical-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/explorer-table-pagination
          fetch-depth: 0

      - name: Patch canonical PinCab Explorer source
        run: python DEV/explorer-pagination-source-edit.py

      - name: Validate canonical source
        shell: bash
        run: |
          python -m py_compile opt/pincabos/web/app.py
          git diff --check
          grep -n "PINCABOS_EXPLORER_TABLE_PAGINATION_V1" opt/pincabos/web/app.py
          grep -n "__PAGINATION_TOP__" opt/pincabos/web/app.py
          grep -n "__PAGINATION_BOTTOM__" opt/pincabos/web/app.py

      - name: Commit canonical source and remove temporary build files
        shell: bash
        run: |
          git config user.name "PinCabOS Source Bot"
          git config user.email "actions@users.noreply.github.com"
          git add opt/pincabos/web/app.py
          git rm .github/workflows/explorer-pagination-source-edit.yml
          git rm DEV/explorer-pagination-source-edit.py
          git commit -m "feat(explorer): paginate Tables listing"
          git push origin HEAD:feat/explorer-table-pagination
