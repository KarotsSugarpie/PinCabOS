# PinCabOS — chemins distribués
# Une entrée absolue par ligne. Les jokers shell (* ? []) sont acceptés.
# Les données utilisateur, tables, réglages matériels et environnements virtuels
# sont volontairement exclus par build-update.sh.

/opt/pincabos/web
/opt/pincabos/bin
/opt/pincabos/script
/opt/pincabos/update

/etc/systemd/system/pincabos-*.service
/etc/systemd/system/pincabos-*.timer
/etc/systemd/system/pincabos-*.path
/etc/systemd/system/pincabos-*.service.d

/etc/udev/rules.d/*pincabos*.rules
/etc/sudoers.d/*pincabos*
