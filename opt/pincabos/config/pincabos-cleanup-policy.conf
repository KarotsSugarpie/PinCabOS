# PinCabOS Cleanup Policy
# Cleanup supprime seulement déchets/temp/cache/build.
# Ne jamais supprimer runtime, dépendances, configs, tables, WebApp, VPX, VPinFE, DOF, Openbox, GRUB, systemd, médias.

[PROTECTED_PATHS]
