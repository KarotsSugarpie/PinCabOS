/opt/pincabos/web
/opt/pincabos/web/.venv
/opt/pincabos/tools
/opt/pincabos/bin
/opt/pincabos/config
/opt/pincabos/install
/opt/pincabos/logs
/opt/pincabos/backups
/opt/pincabos/apps
/opt/pincabos/apps/vpx
/opt/pincabos/apps/frontend
/opt/pincabos/apps/frontend/vpinfe
/opt/pincabos/apps/dof
/opt/pincabos/media
/opt/pincabos/assets
/opt/pincabos/icons
/opt/pincabos/iconpacks
/opt/pincabos/essentials
/opt/pincabos/essenciels
/opt/pincabos/static
/opt/pincabos/settings
/opt/pincabos/branding
/home/pinball/Tables
/home/pinball/.vpinball
/home/pinball/Share
/home/pinball/.config/openbox
/home/pinball/.config/autostart
/home/pinball/.config/gtk-3.0
/home/pinball/.config/pcmanfm
/etc/xdg/openbox
/etc/xdg/autostart
/etc/systemd/system/pincabos-web.service
/etc/systemd/system/pincabos-console.service
/etc/systemd/system/pincabos-vpinfe.service
