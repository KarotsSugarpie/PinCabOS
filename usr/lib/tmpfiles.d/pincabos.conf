# PinCabOS — repertoires runtime : existence, proprietaire et droits garantis a CHAQUE boot.
# Regle le probleme de fond : des services root creent des dossiers dans l espace de la
# WebApp (User=pinball), qui ne peut plus y ecrire (Tables, Downloads, uploads, Backups...).
# Mecanisme standard systemd (systemd-tmpfiles-setup.service, avant les services PinCabOS).
# d = cree si absent (avec owner/mode) ; z = corrige owner/mode si deviant (non recursif).

# Espace utilisateur pinball
d /home/pinball              0755 pinball pinball -
d /home/pinball/Tables       0755 pinball pinball -
d /home/pinball/MediaHunter  0755 pinball pinball -
d /home/pinball/Downloads    0755 pinball pinball -
d /home/pinball/Backups      0755 pinball pinball -
z /home/pinball              0755 pinball pinball -
z /home/pinball/Tables       -    pinball pinball -
z /home/pinball/MediaHunter  -    pinball pinball -
z /home/pinball/Downloads    -    pinball pinball -
z /home/pinball/Backups      -    pinball pinball -

# Runtime WebApp sous /opt/pincabos
d /opt/pincabos/uploads      0755 pinball pinball -
d /opt/pincabos/imports      0755 pinball pinball -
d /opt/pincabos/imports/logs 0755 pinball pinball -
z /opt/pincabos/uploads      -    pinball pinball -
z /opt/pincabos/imports      -    pinball pinball -
z /opt/pincabos/imports/logs -    pinball pinball -

# Partages root + pinball (services root ET webapp y ecrivent) : setgid pinball
d /opt/pincabos/logs         2775 root pinball -
d /opt/pincabos/tmp          2775 root pinball -
z /opt/pincabos/logs         2775 root pinball -
z /opt/pincabos/tmp          2775 root pinball -
